<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Electronics — Kitman Marketplace</title>
  <meta name="description" content="Kitman — the modern multi-vendor marketplace of Ethiopia. Shop authentic Ethiopian goods, tech, fashion and more. Pay with Telebirr, CBE Birr, ArifPay or Cash on Delivery." />

  <!-- Tailwind CSS (v3 CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans (EN), Noto Sans Ethiopic (AM), Cairo (AR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Swiper.js (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    // ---- Tailwind theme configuration -------------------------------------
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            forest: { light: '#0e9c60', DEFAULT: '#0b7a4b', dark: '#075c38', deep: '#043b24' },
            gold:   { light: '#ffce4d', DEFAULT: '#f5b301', dark: '#c98f00' },
            crimson:{ light: '#f04455', DEFAULT: '#d81e2c', dark: '#a8121e' },
            cream:  '#fbf6ec',
            sand:   '#f4ecdd',
            ink:    '#0f172a',
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            ethiopic: ['Noto Sans Ethiopic', 'sans-serif'],
            arabic: ['Cairo', 'sans-serif'],
          },
          boxShadow: {
            soft: '0 4px 24px -6px rgba(15,23,42,0.12)',
            card: '0 10px 30px -12px rgba(15,23,42,0.18)',
            glow: '0 8px 30px -8px rgba(11,122,75,0.45)',
          },
          borderRadius: { '2xl': '1.1rem', '3xl': '1.6rem' },
        }
      }
    }
  </script>

  <style>
    /* Warm base + smooth theme transition */
    html { scroll-behavior: smooth; }
    body { transition: background-color .3s ease, color .3s ease; }
    [x-cloak] { display: none !important; }

    /* Language-driven fonts */
    body.lang-en { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body.lang-am { font-family: 'Noto Sans Ethiopic', sans-serif; }
    body.lang-ar { font-family: 'Cairo', sans-serif; }

    /* Subtle Ethiopian-inspired geometric motif for hero backdrops */
    .motif {
      background-image:
        radial-gradient(circle at 20% 30%, rgba(245,179,1,.18) 0, transparent 22%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,.14) 0, transparent 20%),
        repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 10px, transparent 10px 20px);
    }
    /* Thin scrollbar for story rails */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Swiper theme */
    .swiper-pagination-bullet { background: #ffffff; opacity: .5; }
    .swiper-pagination-bullet-active { background: #f5b301; opacity: 1; width: 22px; border-radius: 4px; }
    .hero-swiper .swiper-button-next, .hero-swiper .swiper-button-prev { color: #fff; }
    .hero-swiper .swiper-button-next:after, .hero-swiper .swiper-button-prev:after { font-size: 20px; }

    /* Gradient text accent */
    .text-gradient { background: linear-gradient(90deg,#0b7a4b,#0e9c60); -webkit-background-clip: text; background-clip: text; color: transparent; }
  </style>

  <script>
    // ---- Global image fallback: no broken-image icons, ever ---------------
    (function () {
      var FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="#0b7a4b"/><stop offset="1" stop-color="#f5b301"/>' +
        '</linearGradient></defs><rect width="400" height="400" fill="url(#g)"/>' +
        '<text x="50%" y="56%" font-size="190" fill="rgba(255,255,255,.35)" ' +
        'text-anchor="middle" font-family="sans-serif">ኪ</text></svg>'
      );
      document.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'IMG' && t.src.indexOf('data:image') !== 0) { t.src = FALLBACK; }
      }, true);
    })();
  </script>

  <script>
    // =====================================================================
    //  Kitman — shared Alpine state, trilingual i18n engine + dark mode
    //  This same kitman() root will power every page in the marketplace.
    // =====================================================================
    function kitman() {
      return {
        // --- global state --------------------------------------------------
        lang: 'en',              // 'en' | 'am' | 'ar'
        dark: false,
        city: 'Addis Ababa',
        cartCount: 3,
        wishCount: 2,
        // UI toggles
        langModal: false,
        searchFocused: false,
        catOpen: false,
        mobileMenu: false,

        // --- notifications (demo) ------------------------------------------
        notifOpen: false,
        notifs: [
          { icon:'truck',        unread:true,  en:'Your order KTM-90312 is on its way', am:'ትዕዛዝዎ KTM-90312 በመንገድ ላይ ነው', ar:'طلبك KTM-90312 في الطريق', time:'2m' },
          { icon:'tag',          unread:true,  en:'Flash sale — up to 40% off tech',     am:'ፍላሽ ሽያጭ — እስከ 40% ቅናሽ',        ar:'تخفيضات — حتى 40٪ على التقنية',  time:'1h' },
          { icon:'star',         unread:false, en:'You received a new 5-star review',     am:'አዲስ 5 ኮከብ ግምገማ ደርሶዎታል',        ar:'حصلت على تقييم 5 نجوم',          time:'3h' },
          { icon:'wallet',       unread:false, en:'Payout of ETB 84,200 was processed',   am:'ክፍያ ETB 84,200 ተከናውኗል',          ar:'تمت تسوية ETB 84,200',           time:'1d' }
        ],
        get unread() { return this.notifs.filter(n => n.unread).length; },
        markAllRead() { this.notifs.forEach(n => n.unread = false); },

        // --- chat with seller (demo) ---------------------------------------
        chatOpen: false, chatWith: '', chatInput: '', chatMsgs: [],
        openChat(name) {
          this.chatWith = name || 'Seller';
          this.chatMsgs = [{ me:false, text:'Selam! Welcome to ' + this.chatWith + '. How can I help you today?' }];
          this.chatOpen = true;
          this.$nextTick(() => { window.lucide && lucide.createIcons(); this.chatScrollBottom(); });
        },
        sendChat(text) {
          const t = (text || this.chatInput).trim();
          if (!t) return;
          this.chatMsgs.push({ me:true, text:t });
          this.chatInput = '';
          this.$nextTick(() => this.chatScrollBottom());
          setTimeout(() => {
            this.chatMsgs.push({ me:false, text:"Thanks for reaching out! Yes, it's available. We deliver across Addis Ababa in 1-2 days and accept Telebirr, CBE Birr, ArifPay and Cash on Delivery." });
            this.$nextTick(() => { window.lucide && lucide.createIcons(); this.chatScrollBottom(); });
          }, 900);
        },
        chatScrollBottom() { const el = this.$refs.chatScroll; if (el) el.scrollTop = el.scrollHeight; },

        // --- write a review (demo) -----------------------------------------
        reviewOpen: false, reviewFor: '', reviewStars: 5, reviewText: '', reviewSent: false,
        openReview(name) { this.reviewFor = name || 'this product'; this.reviewStars = 5; this.reviewText = ''; this.reviewSent = false; this.reviewOpen = true; this.$nextTick(() => window.lucide && lucide.createIcons()); },
        submitReview() { if (!this.reviewText.trim()) return; this.reviewSent = true; this.$nextTick(() => window.lucide && lucide.createIcons()); setTimeout(() => { this.reviewOpen = false; }, 1700); },

        // --- Quick View + Compare (shared across every product card) -------
        quickView: null,          // product object shown in modal
        qvQty: 1,
        compare: [],              // products staged for comparison (max 4)
        compareOpen: false,       // comparison table modal
        openQuickView(p) { this.quickView = p; this.qvQty = 1; this.$nextTick(() => window.lucide && lucide.createIcons()); },
        toggleCompare(p) {
          const i = this.compare.findIndex(x => x.name === p.name);
          if (i > -1) { this.compare.splice(i, 1); }
          else if (this.compare.length < 4) { this.compare.push(p); }
          this.$nextTick(() => window.lucide && lucide.createIcons());
        },
        inCompare(p) { return this.compare.some(x => x.name === p.name); },
        clearCompare() { this.compare = []; this.compareOpen = false; },
        disc(p) { return p.was ? Math.round((1 - p.price / p.was) * 100) : 0; },
        qvAddToCart() { this.cartCount += this.qvQty; this.quickView = null; },

        cities: ['Addis Ababa', 'Adama', 'Hawassa', 'Bahir Dar', 'Dire Dawa', 'Mekelle', 'Gondar'],

        // --- lifecycle -----------------------------------------------------
        init() {
          this.applyLang();
          this.$watch('lang', () => this.applyLang());
          this.$watch('dark', () => document.documentElement.classList.toggle('dark', this.dark));
          this.$nextTick(() => window.lucide && lucide.createIcons());
        },
        applyLang() {
          const rtl = this.lang === 'ar';
          const el = document.documentElement;
          el.lang = this.lang; el.dir = rtl ? 'rtl' : 'ltr';
          document.body.classList.remove('lang-en','lang-am','lang-ar');
          document.body.classList.add('lang-' + this.lang);
          this.$nextTick(() => window.lucide && lucide.createIcons());
        },
        setLang(l) { this.lang = l; this.langModal = false; },

        // --- translation helper -------------------------------------------
        t(key) { return (this.dict[key] && this.dict[key][this.lang]) || (this.dict[key] && this.dict[key].en) || key; },

        langName(l) { return { en: 'English', am: 'አማርኛ', ar: 'العربية' }[l]; },

        // --- price formatter (Ethiopian Birr) -----------------------------
        etb(v) {
          const n = Number(v).toLocaleString('en-US');
          return this.lang === 'am' ? (n + ' ብር') : ('ETB ' + n);
        },

        // --- dictionary ----------------------------------------------------
        dict: {
          ship_to:      { en: 'Deliver to', am: 'መድረሻ', ar: 'التوصيل إلى' },
          support:      { en: 'Help & Support: 8556', am: 'እገዛ: 8556', ar: 'الدعم: 8556' },
          seller_link:  { en: 'Sell on Kitman', am: 'በኪትማን ይሽጡ', ar: 'بِع على كِتمان' },
          track_order:  { en: 'Track Order', am: 'ትዕዛዝ ይከታተሉ', ar: 'تتبع الطلب' },
          search_ph:    { en: 'Search products, brands & vendors…', am: 'እቃዎችን፣ ብራንዶችን ይፈልጉ…', ar: 'ابحث عن المنتجات والبائعين…' },
          all_cats:     { en: 'All Categories', am: 'ሁሉም ምድቦች', ar: 'كل الفئات' },
          account:      { en: 'Account', am: 'መለያ', ar: 'الحساب' },
          wishlist:     { en: 'Wishlist', am: 'ተመራጮች', ar: 'المفضلة' },
          cart:         { en: 'Cart', am: 'ጋሪ', ar: 'السلة' },
          home:         { en: 'Home', am: 'መነሻ', ar: 'الرئيسية' },
          categories:   { en: 'Categories', am: 'ምድቦች', ar: 'الفئات' },
          choose_lang:  { en: 'Choose your language', am: 'ቋንቋ ይምረጡ', ar: 'اختر لغتك' },
          lang_note:    { en: 'Prices, layout and reading direction adapt automatically.', am: 'ዋጋና አቀማመጥ በራስ-ሰር ይስተካከላል።', ar: 'تتكيّف الأسعار والاتجاه تلقائياً.' },
          hero1_tag:    { en: 'MADE IN ETHIOPIA', am: 'በኢትዮጵያ የተሰራ', ar: 'صُنع في إثيوبيا' },
          hero1_title:  { en: 'Authentic Habesha, delivered to your door', am: 'እውነተኛ የሀበሻ ምርቶች እስከ በርዎ', ar: 'منتجات حبشية أصيلة حتى بابك' },
          hero1_sub:    { en: 'Hand-woven Kemis, coffee & crafts from trusted local vendors.', am: 'በእጅ የተሰራ ቀሚስ፣ ቡና እና ጥበባት ከታማኝ ሻጮች።', ar: 'أزياء وبن وحِرف يدوية من بائعين موثوقين.' },
          hero2_tag:    { en: 'MEGA TECH WEEK', am: 'የቴክ ሳምንት', ar: 'أسبوع التقنية' },
          hero2_title:  { en: 'Up to 40% off phones & electronics', am: 'እስከ 40% ቅናሽ በስልኮች እና ኤሌክትሮኒክስ', ar: 'خصم حتى 40٪ على الهواتف والإلكترونيات' },
          hero2_sub:    { en: 'Genuine warranty. Free delivery across Addis Ababa.', am: 'ዋስትና ያለው። በአዲስ አበባ ነፃ መላኪያ።', ar: 'ضمان أصلي وتوصيل مجاني في أديس أبابا.' },
          hero3_tag:    { en: 'NEW SEASON', am: 'አዲስ ወቅት', ar: 'موسم جديد' },
          hero3_title:  { en: 'Fashion that moves with the city', am: 'ከከተማዋ ጋር የሚራመድ ፋሽን', ar: 'أزياء تواكب المدينة' },
          hero3_sub:    { en: 'Discover trending styles from Addis top boutiques.', am: 'ከአዲስ አበባ ምርጥ ሱቆች አዳዲስ ስታይሎች።', ar: 'اكتشف أحدث الصيحات من أرقى متاجر أديس.' },
          shop_now:     { en: 'Shop now', am: 'አሁን ይግዙ', ar: 'تسوّق الآن' },
          explore:      { en: 'Explore deals', am: 'ቅናሾችን ይመልከቱ', ar: 'استكشف العروض' },
          trust_secure: { en: '100% Secure Payments', am: '100% ደህንነቱ የተጠበቀ ክፍያ', ar: 'مدفوعات آمنة 100٪' },
          trust_cod:    { en: 'Cash on Delivery', am: 'በመቀበል ጊዜ ክፍያ', ar: 'الدفع عند الاستلام' },
          trust_pay:    { en: 'Trusted local payments', am: 'የታመኑ የአገር ውስጥ ክፍያዎች', ar: 'وسائل دفع محلية موثوقة' },
        },
      }
    }
  </script>

  <script>
    // ---- Shop / search results page: catalog + live filtering ------------
    function shopPage() {
      return {
        view: 'grid',            // 'grid' | 'list'
        sort: 'featured',
        drawer: false,           // mobile filter drawer
        added: null,
        // filter state
        min: 0, max: 50000,
        cats: [], regions: [], vendors: [], minRating: 0, inStockOnly: false,
        allCats: ['Electronics', 'Home', 'Furniture', 'Fashion', 'Beauty', 'Coffee'],
        allRegions: ['Addis Ababa', 'Adama', 'Hawassa', 'Bahir Dar'],
        allVendors: ['Addis Tech', 'Sound Addis', 'Merkato Home', 'Addis Home', 'Bole Furnish', 'Bole Boutique', 'Addis Style', 'Habesha Glow', 'Glow Addis', 'Tomoca Beans'],
        products: [
          { name: 'Wireless Earbuds Pro ANC', vendor: 'Addis Tech', category: 'Electronics', region: 'Addis Ababa', img: 'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500&q=70', price: 2240, was: 3200, rating: 4.6, reviews: 512, inStock: true },
          { name: 'Samsung Galaxy A55 5G', vendor: 'Addis Tech', category: 'Electronics', region: 'Addis Ababa', img: 'https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=500&q=70', price: 38900, was: 42000, rating: 4.7, reviews: 203, inStock: true },
          { name: 'Power Bank 20000mAh', vendor: 'Sound Addis', category: 'Electronics', region: 'Adama', img: 'https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?w=500&q=70', price: 1650, was: null, rating: 4.7, reviews: 321, inStock: true },
          { name: 'Bluetooth Speaker X3', vendor: 'Sound Addis', category: 'Electronics', region: 'Hawassa', img: 'https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=500&q=70', price: 1850, was: null, rating: 4.5, reviews: 167, inStock: true },
          { name: 'Air Fryer 5L Digital', vendor: 'Merkato Home', category: 'Home', region: 'Addis Ababa', img: 'https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?w=500&q=70', price: 4200, was: 5000, rating: 4.6, reviews: 143, inStock: true },
          { name: 'Espresso Coffee Machine', vendor: 'Addis Home', category: 'Home', region: 'Addis Ababa', img: 'https://images.unsplash.com/photo-1585659722983-3a675dabf23d?w=500&q=70', price: 5600, was: 6500, rating: 4.8, reviews: 88, inStock: false },
          { name: 'Electric Kettle 1.7L', vendor: 'Merkato Home', category: 'Home', region: 'Bahir Dar', img: 'https://images.unsplash.com/photo-1610701596007-11502861dcfa?w=500&q=70', price: 890, was: null, rating: 4.7, reviews: 205, inStock: true },
          { name: 'Modern 3-Seat Sofa', vendor: 'Bole Furnish', category: 'Furniture', region: 'Addis Ababa', img: 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=500&q=70', price: 24000, was: 28000, rating: 4.7, reviews: 63, inStock: true },
          { name: 'Wooden Coffee Table', vendor: 'Bole Furnish', category: 'Furniture', region: 'Adama', img: 'https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?w=500&q=70', price: 5400, was: 6200, rating: 4.6, reviews: 52, inStock: true },
          { name: 'Leather Ankle Boots', vendor: 'Bole Boutique', category: 'Fashion', region: 'Addis Ababa', img: 'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=500&q=70', price: 3600, was: 4500, rating: 4.6, reviews: 88, inStock: true },
          { name: 'Cotton Summer Dress', vendor: 'Addis Style', category: 'Fashion', region: 'Hawassa', img: 'https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=500&q=70', price: 1600, was: null, rating: 4.5, reviews: 145, inStock: true },
          { name: 'Aviator Sunglasses', vendor: 'Bole Boutique', category: 'Fashion', region: 'Addis Ababa', img: 'https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500&q=70', price: 1200, was: 1600, rating: 4.6, reviews: 78, inStock: false },
          { name: 'Shea Body Butter', vendor: 'Habesha Glow', category: 'Beauty', region: 'Addis Ababa', img: 'https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=500&q=70', price: 595, was: 850, rating: 4.7, reviews: 141, inStock: true },
          { name: 'Natural Face Serum', vendor: 'Habesha Glow', category: 'Beauty', region: 'Adama', img: 'https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=500&q=70', price: 1200, was: null, rating: 4.6, reviews: 98, inStock: true },
          { name: 'Eau de Parfum 50ml', vendor: 'Glow Addis', category: 'Beauty', region: 'Addis Ababa', img: 'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=500&q=70', price: 2300, was: null, rating: 4.8, reviews: 59, inStock: true },
          { name: 'Yirgacheffe Coffee 1kg', vendor: 'Tomoca Beans', category: 'Coffee', region: 'Addis Ababa', img: 'https://images.unsplash.com/photo-1447933601403-0c6688de566e?w=500&q=70', price: 980, was: 1400, rating: 4.9, reviews: 342, inStock: true }
        ],
        quickAdd(n) { cartCount++; this.added = n; setTimeout(() => { if (this.added === n) this.added = null }, 1400); },
        clearAll() { this.cats = []; this.regions = []; this.vendors = []; this.minRating = 0; this.inStockOnly = false; this.min = 0; this.max = 50000; },
        get activeCount() { return this.cats.length + this.regions.length + this.vendors.length + (this.minRating ? 1 : 0) + (this.inStockOnly ? 1 : 0); },
        get filtered() {
          let list = this.products.filter(p => {
            if (this.cats.length && !this.cats.includes(p.category)) return false;
            if (this.regions.length && !this.regions.includes(p.region)) return false;
            if (this.vendors.length && !this.vendors.includes(p.vendor)) return false;
            if (p.price < (this.min || 0) || p.price > (this.max || 999999)) return false;
            if (p.rating < this.minRating) return false;
            if (this.inStockOnly && !p.inStock) return false;
            return true;
          });
          if (this.sort === 'price-asc') list = list.slice().sort((a, b) => a.price - b.price);
          else if (this.sort === 'price-desc') list = list.slice().sort((a, b) => b.price - a.price);
          else if (this.sort === 'rating') list = list.slice().sort((a, b) => b.rating - a.rating);
          else if (this.sort === 'discount') list = list.slice().sort((a, b) => this.disc(b) - this.disc(a));
          return list;
        },
        init() { this.$watch('filtered', () => this.$nextTick(() => window.lucide && lucide.createIcons())); this.$nextTick(() => window.lucide && lucide.createIcons()); }
      }
    }
  </script>
</head>

<body class="lang-en bg-cream text-ink dark:bg-ink dark:text-slate-100 antialiased pb-16 md:pb-0"
      x-data="kitman()" x-init="init()" x-cloak>

  <!-- ==================================================================
       1 · TOP MICRO BAR — language · deliver-to city · support · seller
       ================================================================== -->
  <div class="hidden md:block bg-forest-deep text-cream/90 text-xs">
    <div class="max-w-7xl mx-auto px-4 h-9 flex items-center justify-between">
      <div class="flex items-center gap-5">
        <!-- Language switcher trigger -->
        <button @click="langModal = true" class="flex items-center gap-1.5 hover:text-gold transition">
          <i data-lucide="globe" class="w-3.5 h-3.5"></i>
          <span x-text="langName(lang)"></span>
          <i data-lucide="chevron-down" class="w-3 h-3"></i>
        </button>
        <!-- Deliver-to city -->
        <div class="flex items-center gap-1.5">
          <i data-lucide="map-pin" class="w-3.5 h-3.5 text-gold"></i>
          <span x-text="t('ship_to')"></span>
          <select x-model="city" class="bg-transparent border-none text-cream/90 focus:ring-0 cursor-pointer hover:text-gold py-0 pe-5">
            <template x-for="c in cities" :key="c"><option class="text-ink" x-text="c" :value="c"></option></template>
          </select>
        </div>
      </div>
      <div class="flex items-center gap-5">
        <a href="#" class="flex items-center gap-1.5 hover:text-gold transition"><i data-lucide="package-search" class="w-3.5 h-3.5"></i><span x-text="t('track_order')"></span></a>
        <a href="#" class="flex items-center gap-1.5 hover:text-gold transition"><i data-lucide="headphones" class="w-3.5 h-3.5"></i><span x-text="t('support')"></span></a>
        <a href="vendor-register.html" class="flex items-center gap-1.5 font-semibold text-gold hover:text-gold-light transition"><i data-lucide="store" class="w-3.5 h-3.5"></i><span x-text="t('seller_link')"></span></a>
      </div>
    </div>
  </div>

  <!-- ==================================================================
       2 · MAIN HEADER — logo · smart search · account/wishlist/cart
       ================================================================== -->
  <header class="sticky top-0 z-40 bg-cream/95 dark:bg-ink/95 backdrop-blur border-b border-black/5 dark:border-white/10 shadow-soft">
    <div class="max-w-7xl mx-auto px-4 h-16 md:h-20 flex items-center gap-3 md:gap-6">

      <!-- Mobile menu button -->
      <button @click="mobileMenu = true" class="md:hidden p-2 -ms-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10" aria-label="Menu">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>

      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-2 shrink-0">
        <span class="grid place-items-center w-10 h-10 rounded-xl bg-forest text-white shadow-glow font-extrabold text-lg">ኪ</span>
        <span class="hidden sm:block leading-none">
          <span class="block text-xl font-extrabold tracking-tight text-forest dark:text-forest-light">Kitman</span>
          <span class="block text-[10px] tracking-[0.25em] text-ink/50 dark:text-slate-400 uppercase">Marketplace</span>
        </span>
      </a>

      <!-- Smart search (desktop) -->
      <div class="hidden md:flex flex-1 max-w-2xl relative"
           @click.outside="searchFocused = false; catOpen = false">
        <div class="flex w-full rounded-2xl ring-1 ring-black/10 dark:ring-white/15 focus-within:ring-2 focus-within:ring-forest bg-white dark:bg-slate-800 overflow-hidden">
          <button @click.stop="catOpen=!catOpen; searchFocused=false" class="flex items-center gap-1 px-4 text-sm text-ink/70 dark:text-slate-300 border-e border-black/10 dark:border-white/10 hover:bg-black/5">
            <span x-text="t('all_cats')"></span><i data-lucide="chevron-down" class="w-4 h-4"></i>
          </button>
          <input type="text" @focus="searchFocused = true" :placeholder="t('search_ph')"
                 class="flex-1 px-4 py-3 bg-transparent outline-none text-sm placeholder:text-ink/40 dark:placeholder:text-slate-400" />
          <button class="px-5 bg-forest hover:bg-forest-dark text-white transition"><i data-lucide="search" class="w-5 h-5"></i></button>
        </div>
        <!-- Categories dropdown -->
        <div x-show="catOpen" x-transition class="absolute top-full mt-2 start-0 w-64 bg-white dark:bg-slate-800 rounded-2xl shadow-card ring-1 ring-black/5 dark:ring-white/10 p-2 z-50">
          <template x-for="c in [
              {en:'Electronics',am:'ኤሌክትሮኒክስ',ar:'إلكترونيات',icon:'smartphone'},
              {en:'Fashion',am:'ፋሽን',ar:'أزياء',icon:'shopping-bag'},
              {en:'Coffee & Spice',am:'ቡና እና ቅመም',ar:'بن وتوابل',icon:'coffee'},
              {en:'Home & Kitchen',am:'ቤት እና ኩሽና',ar:'المنزل والمطبخ',icon:'cooking-pot'},
              {en:'Appliances',am:'የቤት እቃዎች',ar:'أجهزة منزلية',icon:'washing-machine'},
              {en:'Habesha Kemis',am:'የሀበሻ ቀሚስ',ar:'أزياء حبشية',icon:'shirt'},
              {en:'Cosmetics',am:'ውበት',ar:'مستحضرات تجميل',icon:'sparkles'},
              {en:'Furniture',am:'የቤት እቃ',ar:'أثاث',icon:'armchair'},
              {en:'Supermarket',am:'ሱፐርማርኬት',ar:'سوبر ماركت',icon:'shopping-cart'}
            ]" :key="c.en">
            <a href="shop.html" @click="catOpen=false" class="flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-forest/5 dark:hover:bg-white/5 text-sm">
              <i :data-lucide="c.icon" class="w-4 h-4 text-forest"></i><span x-text="lang==='am'?c.am:lang==='ar'?c.ar:c.en"></span>
            </a>
          </template>
        </div>
        <!-- Autocomplete suggestions -->
        <div x-show="searchFocused" x-transition
             class="absolute top-full mt-2 w-full bg-white dark:bg-slate-800 rounded-2xl shadow-card ring-1 ring-black/5 dark:ring-white/10 p-2 z-50">
          <p class="px-3 py-1 text-[11px] uppercase tracking-wide text-ink/40 dark:text-slate-400">Trending searches</p>
          <template x-for="s in ['Traditional Habesha Dresses','Samsung Galaxy','Yirgacheffe Coffee Beans','Netela & Gabi','Injera Maker']" :key="s">
            <a href="shop.html" class="flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-forest/5 dark:hover:bg-white/5 text-sm">
              <i data-lucide="search" class="w-4 h-4 text-ink/40"></i><span x-text="s"></span>
            </a>
          </template>
        </div>
      </div>

      <!-- Right actions -->
      <div class="flex items-center gap-1 md:gap-2 ms-auto">
        <!-- Dark mode toggle -->
        <button @click="dark = !dark" class="p-2.5 rounded-xl hover:bg-black/5 dark:hover:bg-white/10 transition" aria-label="Toggle theme">
          <i data-lucide="moon" class="w-5 h-5" x-show="!dark"></i>
          <i data-lucide="sun" class="w-5 h-5 text-gold" x-show="dark"></i>
        </button>
        <!-- Notifications -->
        <button @click="notifOpen=true" class="relative p-2.5 rounded-xl hover:bg-black/5 dark:hover:bg-white/10 transition" aria-label="Notifications">
          <i data-lucide="bell" class="w-5 h-5"></i>
          <span x-show="unread>0" class="absolute top-1 end-1 min-w-4 h-4 px-1 grid place-items-center text-[9px] font-bold text-white bg-crimson rounded-full" x-text="unread"></span>
        </button>
        <!-- Account -->
        <a href="profile.html" class="hidden md:flex items-center gap-2 p-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/10 transition">
          <i data-lucide="user-round" class="w-5 h-5"></i>
          <span class="text-sm font-medium" x-text="t('account')"></span>
        </a>
        <!-- Wishlist -->
        <a href="wishlist.html" class="relative p-2.5 rounded-xl hover:bg-black/5 dark:hover:bg-white/10 transition">
          <i data-lucide="heart" class="w-5 h-5"></i>
          <span x-show="wishCount>0" class="absolute -top-0.5 -end-0.5 min-w-4 h-4 px-1 grid place-items-center text-[10px] font-bold text-white bg-crimson rounded-full" x-text="wishCount"></span>
        </a>
        <!-- Cart -->
        <a href="cart.html" class="relative p-2.5 rounded-xl hover:bg-black/5 dark:hover:bg-white/10 transition">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          <span x-show="cartCount>0" class="absolute -top-0.5 -end-0.5 min-w-4 h-4 px-1 grid place-items-center text-[10px] font-bold text-white bg-crimson rounded-full" x-text="cartCount"></span>
        </a>
      </div>
    </div>

    <!-- Smart search (mobile, below header row) -->
    <div class="md:hidden px-4 pb-3">
      <div class="flex w-full rounded-2xl ring-1 ring-black/10 dark:ring-white/15 bg-white dark:bg-slate-800 overflow-hidden">
        <input type="text" :placeholder="t('search_ph')" class="flex-1 px-4 py-2.5 bg-transparent outline-none text-sm placeholder:text-ink/40 dark:placeholder:text-slate-400" />
        <button class="px-4 bg-forest text-white"><i data-lucide="search" class="w-5 h-5"></i></button>
      </div>
    </div>
  </header>

  <!-- ==================================================================
       SHOP HEADER — breadcrumb + title + toolbar
       ================================================================== -->
  <section class="max-w-7xl mx-auto px-4 pt-4" x-data="shopPage()" x-init="init()">
    <nav class="text-sm text-ink/60 dark:text-slate-400" aria-label="Breadcrumb">
      <ol class="flex items-center gap-1.5">
        <li><a href="index.html" class="hover:text-forest" x-text="t('home')"></a></li>
        <li><i data-lucide="chevron-right" class="w-4 h-4 rtl:rotate-180"></i></li>
        <li class="text-ink dark:text-slate-200 font-medium" x-text="lang==='am'?'ገበያ':lang==='ar'?'المتجر':'Shop'"></li>
      </ol>
    </nav>

    <div class="flex flex-wrap items-end justify-between gap-3 mt-3">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold" x-text="lang==='am'?'ሁሉም ምርቶች':lang==='ar'?'كل المنتجات':'All Products'"></h1>
        <p class="text-sm text-ink/60 dark:text-slate-400 mt-0.5">
          <span class="font-semibold text-ink dark:text-slate-200" x-text="filtered.length"></span>
          <span x-text="lang==='am'?' ውጤቶች':lang==='ar'?' نتيجة':' results'"></span>
          <span x-show="activeCount>0" x-text="'· '+activeCount+(lang==='am'?' ማጣሪያ':lang==='ar'?' فلتر':' filters')"></span>
        </p>
      </div>

      <!-- toolbar -->
      <div class="flex items-center gap-2">
        <button @click="drawer=true" class="lg:hidden inline-flex items-center gap-1.5 h-10 px-3 rounded-xl ring-1 ring-black/10 dark:ring-white/15 text-sm font-semibold">
          <i data-lucide="sliders-horizontal" class="w-4 h-4"></i><span x-text="lang==='am'?'ማጣሪያ':lang==='ar'?'تصفية':'Filters'"></span>
          <span x-show="activeCount>0" class="min-w-5 h-5 px-1 grid place-items-center text-[10px] font-bold text-white bg-forest rounded-full" x-text="activeCount"></span>
        </button>
        <div class="relative inline-flex items-center h-10 rounded-xl ring-1 ring-black/10 dark:ring-white/15 bg-white dark:bg-slate-800">
          <i data-lucide="arrow-up-down" class="w-4 h-4 ms-3 text-ink/50"></i>
          <select x-model="sort" class="h-10 ps-2 pe-8 bg-transparent text-sm font-medium outline-none cursor-pointer">
            <option value="featured" x-text="lang==='am'?'ተመራጭ':lang==='ar'?'مميز':'Featured'"></option>
            <option value="price-asc" x-text="lang==='am'?'ዋጋ ዝቅ ወደ ከፍ':lang==='ar'?'السعر: تصاعدي':'Price: Low to High'"></option>
            <option value="price-desc" x-text="lang==='am'?'ዋጋ ከፍ ወደ ዝቅ':lang==='ar'?'السعر: تنازلي':'Price: High to Low'"></option>
            <option value="rating" x-text="lang==='am'?'ከፍተኛ ደረጃ':lang==='ar'?'الأعلى تقييماً':'Top Rated'"></option>
            <option value="discount" x-text="lang==='am'?'ከፍተኛ ቅናሽ':lang==='ar'?'أكبر خصم':'Biggest Discount'"></option>
          </select>
        </div>
        <div class="hidden sm:flex items-center h-10 rounded-xl ring-1 ring-black/10 dark:ring-white/15 bg-white dark:bg-slate-800 overflow-hidden">
          <button @click="view='grid'" :class="view==='grid'?'bg-forest text-white':'text-ink/50'" class="grid place-items-center w-10 h-10 transition" aria-label="Grid view"><i data-lucide="layout-grid" class="w-4 h-4"></i></button>
          <button @click="view='list'" :class="view==='list'?'bg-forest text-white':'text-ink/50'" class="grid place-items-center w-10 h-10 transition" aria-label="List view"><i data-lucide="list" class="w-4 h-4"></i></button>
        </div>
      </div>
    </div>

    <!-- active filter chips -->
    <div x-show="activeCount>0" class="flex flex-wrap items-center gap-2 mt-3">
      <template x-for="c in cats" :key="'c'+c"><button @click="cats=cats.filter(x=>x!==c)" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-forest/10 text-forest text-xs font-semibold"><span x-text="c"></span><i data-lucide="x" class="w-3 h-3"></i></button></template>
      <template x-for="r in regions" :key="'r'+r"><button @click="regions=regions.filter(x=>x!==r)" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-forest/10 text-forest text-xs font-semibold"><span x-text="r"></span><i data-lucide="x" class="w-3 h-3"></i></button></template>
      <template x-for="v in vendors" :key="'v'+v"><button @click="vendors=vendors.filter(x=>x!==v)" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-forest/10 text-forest text-xs font-semibold"><span x-text="v"></span><i data-lucide="x" class="w-3 h-3"></i></button></template>
      <button x-show="minRating>0" @click="minRating=0" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-gold/20 text-gold-dark text-xs font-semibold"><span x-text="minRating+'★ +'"></span><i data-lucide="x" class="w-3 h-3"></i></button>
      <button x-show="inStockOnly" @click="inStockOnly=false" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-forest/10 text-forest text-xs font-semibold"><span x-text="lang==='am'?'በክምችት':lang==='ar'?'متوفر':'In stock'"></span><i data-lucide="x" class="w-3 h-3"></i></button>
      <button @click="clearAll()" class="text-xs font-semibold text-crimson hover:underline ms-1" x-text="lang==='am'?'ሁሉንም አጽዳ':lang==='ar'?'مسح الكل':'Clear all'"></button>
    </div>

    <!-- ============ LAYOUT: filters + results ============ -->
    <div class="flex gap-6 mt-5 relative">

      <!-- overlay (mobile) -->
      <div x-show="drawer" x-transition.opacity class="lg:hidden fixed inset-0 bg-ink/50 z-[60]" @click="drawer=false" x-cloak></div>

      <!-- FILTERS: slide-over on mobile, sticky sidebar on desktop -->
      <aside :class="drawer ? 'translate-x-0' : '-translate-x-full rtl:translate-x-full'"
             class="fixed lg:static inset-y-0 start-0 z-[60] lg:z-auto w-80 max-w-[85%] lg:w-64 lg:max-w-none shrink-0
                    bg-cream dark:bg-ink lg:bg-transparent p-5 lg:p-0 overflow-y-auto lg:overflow-visible
                    transition-transform lg:translate-x-0 lg:sticky lg:top-24 lg:self-start">
        <div class="flex items-center justify-between mb-4 lg:hidden">
          <span class="text-lg font-extrabold" x-text="lang==='am'?'ማጣሪያዎች':lang==='ar'?'التصفية':'Filters'"></span>
          <button @click="drawer=false" class="p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <div class="space-y-5 text-sm">
          <!-- price -->
          <div class="pb-5 border-b border-black/5 dark:border-white/10">
            <h3 class="font-bold mb-3" x-text="lang==='am'?'ዋጋ (ETB)':lang==='ar'?'السعر (ETB)':'Price (ETB)'"></h3>
            <div class="flex items-center gap-2">
              <input type="number" x-model.number="min" placeholder="0" class="w-full px-3 py-2 rounded-lg ring-1 ring-black/10 dark:ring-white/15 bg-white dark:bg-slate-800 outline-none focus:ring-forest" />
              <span class="text-ink/40">–</span>
              <input type="number" x-model.number="max" placeholder="50000" class="w-full px-3 py-2 rounded-lg ring-1 ring-black/10 dark:ring-white/15 bg-white dark:bg-slate-800 outline-none focus:ring-forest" />
            </div>
            <div class="flex flex-wrap gap-1.5 mt-2">
              <template x-for="r in [{l:'< 1k',mn:0,mx:1000},{l:'1k–5k',mn:1000,mx:5000},{l:'5k–20k',mn:5000,mx:20000},{l:'20k+',mn:20000,mx:50000}]" :key="r.l">
                <button @click="min=r.mn; max=r.mx" class="px-2 py-1 rounded-md bg-black/[.04] dark:bg-white/5 text-xs hover:bg-forest/10 hover:text-forest transition" x-text="r.l"></button>
              </template>
            </div>
          </div>

          <!-- category -->
          <div class="pb-5 border-b border-black/5 dark:border-white/10">
            <h3 class="font-bold mb-3" x-text="lang==='am'?'ምድብ':lang==='ar'?'الفئة':'Category'"></h3>
            <div class="space-y-2">
              <template x-for="c in allCats" :key="c">
                <label class="flex items-center gap-2.5 cursor-pointer">
                  <input type="checkbox" :value="c" x-model="cats" class="w-4 h-4 rounded accent-forest" />
                  <span x-text="c"></span>
                  <span class="ms-auto text-xs text-ink/40" x-text="products.filter(p=>p.category===c).length"></span>
                </label>
              </template>
            </div>
          </div>

          <!-- region -->
          <div class="pb-5 border-b border-black/5 dark:border-white/10">
            <h3 class="font-bold mb-3" x-text="lang==='am'?'ክልል / ከተማ':lang==='ar'?'المنطقة':'Region / City'"></h3>
            <div class="space-y-2">
              <template x-for="r in allRegions" :key="r">
                <label class="flex items-center gap-2.5 cursor-pointer">
                  <input type="checkbox" :value="r" x-model="regions" class="w-4 h-4 rounded accent-forest" />
                  <span x-text="r"></span>
                </label>
              </template>
            </div>
          </div>

          <!-- vendor -->
          <div class="pb-5 border-b border-black/5 dark:border-white/10">
            <h3 class="font-bold mb-3" x-text="lang==='am'?'ሻጭ':lang==='ar'?'البائع':'Vendor'"></h3>
            <div class="space-y-2 max-h-44 overflow-y-auto pe-1">
              <template x-for="v in allVendors" :key="v">
                <label class="flex items-center gap-2.5 cursor-pointer">
                  <input type="checkbox" :value="v" x-model="vendors" class="w-4 h-4 rounded accent-forest" />
                  <span class="truncate" x-text="v"></span>
                </label>
              </template>
            </div>
          </div>

          <!-- rating -->
          <div class="pb-5 border-b border-black/5 dark:border-white/10">
            <h3 class="font-bold mb-3" x-text="lang==='am'?'ደረጃ':lang==='ar'?'التقييم':'Rating'"></h3>
            <div class="space-y-2">
              <template x-for="rt in [4.5,4,3.5]" :key="rt">
                <label class="flex items-center gap-2.5 cursor-pointer">
                  <input type="radio" name="rating" :value="rt" x-model.number="minRating" class="w-4 h-4 accent-forest" />
                  <span class="flex text-gold"><template x-for="s in 5" :key="s"><i data-lucide="star" class="w-3.5 h-3.5" :class="s<=Math.round(rt)?'fill-current':'opacity-30'"></i></template></span>
                  <span class="text-xs text-ink/50" x-text="'& '+(lang==='am'?'ከዚያ በላይ':lang==='ar'?'وأعلى':'up')"></span>
                </label>
              </template>
            </div>
          </div>

          <!-- availability -->
          <div>
            <label class="flex items-center gap-2.5 cursor-pointer">
              <input type="checkbox" x-model="inStockOnly" class="w-4 h-4 rounded accent-forest" />
              <span class="font-medium" x-text="lang==='am'?'በክምችት ያሉ ብቻ':lang==='ar'?'المتوفر فقط':'In stock only'"></span>
            </label>
          </div>
        </div>

        <!-- mobile apply/clear -->
        <div class="flex gap-2 mt-6 lg:hidden">
          <button @click="clearAll()" class="flex-1 py-3 rounded-xl ring-1 ring-black/10 dark:ring-white/15 font-semibold" x-text="lang==='am'?'አጽዳ':lang==='ar'?'مسح':'Clear'"></button>
          <button @click="drawer=false" class="flex-1 py-3 rounded-xl bg-forest text-white font-semibold"><span x-text="lang==='am'?'አሳይ':lang==='ar'?'عرض':'Show'"></span> (<span x-text="filtered.length"></span>)</button>
        </div>
      </aside>

      <!-- RESULTS -->
      <div class="flex-1 min-w-0">
        <!-- empty state -->
        <div x-show="filtered.length===0" class="text-center py-20">
          <span class="inline-grid place-items-center w-16 h-16 rounded-full bg-black/5 dark:bg-white/10 mb-3"><i data-lucide="search-x" class="w-8 h-8 text-ink/40"></i></span>
          <p class="font-semibold" x-text="lang==='am'?'ምንም ውጤት አልተገኘም':lang==='ar'?'لا توجد نتائج':'No products match'"></p>
          <button @click="clearAll()" class="mt-3 px-4 py-2 rounded-xl bg-forest text-white text-sm font-semibold" x-text="lang==='am'?'ማጣሪያ አጽዳ':lang==='ar'?'مسح التصفية':'Clear filters'"></button>
        </div>

        <!-- GRID -->
        <div x-show="filtered.length>0 && view==='grid'" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">

  <div x-show="compare.length" x-transition
       class="fixed z-[55] inset-x-0 bottom-16 md:bottom-4 px-3 md:px-4" x-cloak>
    <div class="max-w-3xl mx-auto bg-white dark:bg-slate-800 rounded-2xl shadow-card ring-1 ring-black/10 dark:ring-white/10 p-2.5 flex items-center gap-2.5">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar flex-1">
        <template x-for="c in compare" :key="c.name">
          <div class="relative shrink-0">
            <img :src="c.img" class="w-12 h-12 rounded-lg object-cover" alt="" />
            <button @click="toggleCompare(c)" class="absolute -top-1.5 -end-1.5 w-5 h-5 grid place-items-center rounded-full bg-crimson text-white shadow"><i data-lucide="x" class="w-3 h-3"></i></button>
          </div>
        </template>
        <template x-for="n in Math.max(0, 2-compare.length)" :key="'ph'+n">
          <div class="shrink-0 w-12 h-12 rounded-lg border-2 border-dashed border-black/15 dark:border-white/20 grid place-items-center text-black/25 dark:text-white/30"><i data-lucide="plus" class="w-4 h-4"></i></div>
        </template>
      </div>
      <button @click="compareOpen=true" :disabled="compare.length<2" :class="compare.length<2 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-forest-dark'"
              class="shrink-0 flex items-center gap-1.5 h-10 px-3 md:px-4 rounded-xl bg-forest text-white font-semibold text-sm transition">
        <i data-lucide="git-compare" class="w-4 h-4"></i>
        <span x-text="(lang==='am'?'አወዳድር':lang==='ar'?'قارن':'Compare')+' ('+compare.length+')'"></span>
      </button>
      <button @click="clearCompare()" class="shrink-0 grid place-items-center w-10 h-10 rounded-xl hover:bg-black/5 dark:hover:bg-white/10" aria-label="Clear compare"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
    </div>
  </div>

  <!-- ==================================================================
       COMPARE MODAL — side-by-side spec table (scrolls horizontally)
       ================================================================== -->
  <div x-show="compareOpen" x-transition.opacity
       class="fixed inset-0 z-[70] bg-ink/60 backdrop-blur-sm flex items-end md:items-center justify-center md:p-4"
       @click.self="compareOpen=false" @keydown.escape.window="compareOpen=false" x-cloak>
    <div x-show="compareOpen"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="translate-y-full md:translate-y-0 md:scale-95 opacity-0"
         x-transition:enter-end="translate-y-0 md:scale-100 opacity-100"
         class="w-full md:max-w-4xl bg-white dark:bg-slate-800 rounded-t-3xl md:rounded-3xl shadow-card max-h-[90vh] overflow-hidden flex flex-col">
      <div class="flex items-center justify-between p-4 border-b border-black/5 dark:border-white/10">
        <h3 class="text-lg font-extrabold flex items-center gap-2"><i data-lucide="git-compare" class="w-5 h-5 text-forest"></i><span x-text="lang==='am'?'ምርቶችን አወዳድር' : lang==='ar'?'مقارنة المنتجات' : 'Compare Products'"></span></h3>
        <button @click="compareOpen=false" class="grid place-items-center w-9 h-9 rounded-full hover:bg-black/5 dark:hover:bg-white/10"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="overflow-auto p-4">
        <div class="grid gap-x-3 min-w-max text-sm" :style="'grid-template-columns: 110px repeat('+compare.length+', minmax(150px,1fr))'">
          <!-- product header row -->
          <div></div>
          <template x-for="c in compare" :key="'h'+c.name">
            <div class="pb-3">
              <div class="relative">
                <img :src="c.img" class="w-full aspect-square object-cover rounded-xl" alt="" />
                <button @click="toggleCompare(c)" class="absolute top-1.5 end-1.5 w-6 h-6 grid place-items-center rounded-full bg-white/90 dark:bg-slate-900/90 shadow"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
              </div>
              <p class="font-semibold mt-2 line-clamp-2 leading-snug" x-text="c.name"></p>
            </div>
          </template>
          <!-- price -->
          <div class="py-3 border-t border-black/5 dark:border-white/10 font-medium text-ink/60 dark:text-slate-400" x-text="lang==='am'?'ዋጋ':lang==='ar'?'السعر':'Price'"></div>
          <template x-for="c in compare" :key="'p'+c.name"><div class="py-3 border-t border-black/5 dark:border-white/10"><span class="font-extrabold text-forest dark:text-forest-light" x-text="etb(c.price)"></span><span x-show="c.was" class="block text-[11px] text-ink/40 line-through" x-text="c.was?etb(c.was):''"></span></div></template>
          <!-- discount -->
          <div class="py-3 border-t border-black/5 dark:border-white/10 font-medium text-ink/60 dark:text-slate-400" x-text="lang==='am'?'ቅናሽ':lang==='ar'?'الخصم':'Discount'"></div>
          <template x-for="c in compare" :key="'d'+c.name"><div class="py-3 border-t border-black/5 dark:border-white/10"><span x-show="c.was" class="px-1.5 py-0.5 rounded bg-crimson/10 text-crimson font-bold text-xs" x-text="'-'+disc(c)+'%'"></span><span x-show="!c.was" class="text-ink/40">—</span></div></template>
          <!-- rating -->
          <div class="py-3 border-t border-black/5 dark:border-white/10 font-medium text-ink/60 dark:text-slate-400" x-text="lang==='am'?'ደረጃ':lang==='ar'?'التقييم':'Rating'"></div>
          <template x-for="c in compare" :key="'r'+c.name"><div class="py-3 border-t border-black/5 dark:border-white/10 flex items-center gap-1"><i data-lucide="star" class="w-4 h-4 fill-gold text-gold"></i><b x-text="c.rating"></b><span class="text-ink/40 text-xs" x-text="'('+c.reviews+')'"></span></div></template>
          <!-- vendor -->
          <div class="py-3 border-t border-black/5 dark:border-white/10 font-medium text-ink/60 dark:text-slate-400" x-text="lang==='am'?'ሻጭ':lang==='ar'?'البائع':'Seller'"></div>
          <template x-for="c in compare" :key="'v'+c.name"><div class="py-3 border-t border-black/5 dark:border-white/10 flex items-center gap-1 text-forest font-semibold"><span x-text="c.vendor"></span><i data-lucide="badge-check" class="w-4 h-4"></i></div></template>
          <!-- action -->
          <div class="py-3 border-t border-black/5 dark:border-white/10"></div>
          <template x-for="c in compare" :key="'a'+c.name"><div class="py-3 border-t border-black/5 dark:border-white/10"><button @click="cartCount++" class="w-full h-10 rounded-xl bg-forest/10 text-forest hover:bg-forest hover:text-white font-semibold text-sm transition inline-flex items-center justify-center gap-1"><i data-lucide="plus" class="w-4 h-4"></i><span x-text="lang==='am'?'ጨምር':lang==='ar'?'أضف':'Add'"></span></button></div></template>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================================================================
       LANGUAGE SWITCHER MODAL
       ================================================================== -->
    <!-- KITMAN:NOTIF -->
  <div x-show="notifOpen" x-transition.opacity class="fixed inset-0 z-[75]" @click.self="notifOpen=false" x-cloak>
    <div x-show="notifOpen" x-transition
         class="absolute top-[4.75rem] end-3 md:end-6 w-80 max-w-[92vw] bg-white dark:bg-slate-800 rounded-2xl shadow-[0_24px_60px_-15px_rgba(15,23,42,0.35)] ring-1 ring-black/5 dark:ring-white/10 overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-black/5 dark:border-white/10">
        <span class="font-bold" x-text="lang==='am'?'ማሳወቂያዎች':lang==='ar'?'الإشعارات':'Notifications'"></span>
        <button @click="markAllRead()" class="text-xs font-semibold text-forest hover:underline" x-text="lang==='am'?'ሁሉንም አንብብ':lang==='ar'?'تعليم الكل كمقروء':'Mark all read'"></button>
      </div>
      <div class="max-h-80 overflow-y-auto divide-y divide-black/5 dark:divide-white/10">
        <template x-for="(n,i) in notifs" :key="i">
          <div class="flex items-start gap-3 px-4 py-3 hover:bg-black/[0.03] dark:hover:bg-white/5 transition">
            <span class="grid place-items-center w-9 h-9 rounded-xl bg-forest/10 text-forest shrink-0"><i :data-lucide="n.icon" class="w-[18px] h-[18px]"></i></span>
            <div class="flex-1 min-w-0"><p class="text-sm leading-snug" x-text="lang==='am'?n.am:lang==='ar'?n.ar:n.en"></p><p class="text-[11px] text-black/40 dark:text-white/40 mt-0.5" x-text="n.time"></p></div>
            <span x-show="n.unread" class="w-2 h-2 rounded-full bg-crimson mt-1.5 shrink-0"></span>
          </div>
        </template>
      </div>
      <a href="#" class="block text-center px-4 py-3 text-sm font-semibold text-forest hover:bg-black/[0.03] dark:hover:bg-white/5 border-t border-black/5 dark:border-white/10" x-text="lang==='am'?'ሁሉንም ማሳወቂያ ይመልከቱ':lang==='ar'?'عرض كل الإشعارات':'View all notifications'"></a>
    </div>
  </div>

  <div x-show="langModal" x-transition.opacity class="fixed inset-0 z-[60] bg-ink/60 backdrop-blur-sm grid place-items-center p-4" @click.self="langModal=false" x-cloak>
    <div x-show="langModal" x-transition.scale class="w-full max-w-sm bg-white dark:bg-slate-800 rounded-3xl shadow-card p-6">
      <div class="flex items-center justify-between mb-1">
        <h3 class="text-lg font-bold" x-text="t('choose_lang')"></h3>
        <button @click="langModal=false" class="p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <p class="text-sm text-ink/60 dark:text-slate-400 mb-4" x-text="t('lang_note')"></p>
      <div class="space-y-2">
        <template x-for="l in ['en','am','ar']" :key="l">
          <button @click="setLang(l)" :class="lang===l ? 'ring-2 ring-forest bg-forest/5' : 'ring-1 ring-black/10 dark:ring-white/10'"
                  class="w-full flex items-center justify-between px-4 py-3 rounded-2xl transition hover:bg-forest/5">
            <span class="flex items-center gap-3">
              <span class="grid place-items-center w-9 h-9 rounded-xl bg-forest/10 text-forest font-bold" x-text="l==='en'?'EN':l==='am'?'አ':'ع'"></span>
              <span class="font-semibold" x-text="langName(l)"></span>
            </span>
            <i data-lucide="check" class="w-5 h-5 text-forest" x-show="lang===l"></i>
          </button>
        </template>
      </div>
    </div>
  </div>

  <!-- ==================================================================
       MOBILE SLIDE-OVER MENU
       ================================================================== -->
  <div x-show="mobileMenu" x-transition.opacity class="fixed inset-0 z-[60] bg-ink/50 md:hidden" @click.self="mobileMenu=false" x-cloak>
    <div x-show="mobileMenu"
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="-translate-x-full rtl:translate-x-full" x-transition:enter-end="translate-x-0"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full rtl:translate-x-full"
         class="absolute inset-y-0 start-0 w-80 max-w-[85%] bg-cream dark:bg-ink shadow-card p-5 overflow-y-auto">
      <div class="flex items-center justify-between mb-6">
        <span class="text-xl font-extrabold text-forest">Kitman</span>
        <button @click="mobileMenu=false" class="p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <button @click="langModal=true; mobileMenu=false" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl bg-white dark:bg-slate-800 ring-1 ring-black/5 dark:ring-white/10 mb-4">
        <i data-lucide="globe" class="w-5 h-5 text-forest"></i><span class="font-semibold" x-text="langName(lang)"></span>
      </button>
      <nav class="space-y-1">
        <template x-for="m in [
          {k:'home', href:'index.html', icon:'home'},
          {k:'categories', href:'shop.html', icon:'layout-grid'},
          {k:'track_order', href:'orders.html', icon:'package-search'},
          {k:'wishlist', href:'wishlist.html', icon:'heart'},
          {k:'account', href:'profile.html', icon:'user-round'},
          {k:'seller_link', href:'vendor-register.html', icon:'store'}
        ]" :key="m.k">
          <a :href="m.href" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-forest/5 dark:hover:bg-white/5 font-medium">
            <i :data-lucide="m.icon" class="w-5 h-5 text-forest"></i><span x-text="t(m.k)"></span>
          </a>
        </template>
      </nav>
    </div>
  </div>

  <!-- ==================================================================
       10 · MOBILE APP-LIKE BOTTOM NAVIGATION
       ================================================================== -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-50 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-black/5 dark:border-white/10 shadow-[0_-4px_20px_-6px_rgba(0,0,0,0.15)]">
    <div class="grid grid-cols-5 h-16">
      <a href="index.html" class="flex flex-col items-center justify-center gap-0.5 text-forest">
        <i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-semibold" x-text="t('home')"></span>
      </a>
      <a href="shop.html" class="flex flex-col items-center justify-center gap-0.5 text-ink/60 dark:text-slate-400">
        <i data-lucide="layout-grid" class="w-5 h-5"></i><span class="text-[10px] font-medium" x-text="t('categories')"></span>
      </a>
      <a href="cart.html" class="relative flex flex-col items-center justify-center gap-0.5 text-ink/60 dark:text-slate-400">
        <span class="relative">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          <span x-show="cartCount>0" class="absolute -top-1.5 -end-2 min-w-4 h-4 px-1 grid place-items-center text-[9px] font-bold text-white bg-crimson rounded-full" x-text="cartCount"></span>
        </span>
        <span class="text-[10px] font-medium" x-text="t('cart')"></span>
      </a>
      <a href="wishlist.html" class="relative flex flex-col items-center justify-center gap-0.5 text-ink/60 dark:text-slate-400">
        <span class="relative">
          <i data-lucide="heart" class="w-5 h-5"></i>
          <span x-show="wishCount>0" class="absolute -top-1.5 -end-2 min-w-4 h-4 px-1 grid place-items-center text-[9px] font-bold text-white bg-crimson rounded-full" x-text="wishCount"></span>
        </span>
        <span class="text-[10px] font-medium" x-text="t('wishlist')"></span>
      </a>
      <a href="profile.html" class="flex flex-col items-center justify-center gap-0.5 text-ink/60 dark:text-slate-400">
        <i data-lucide="user-round" class="w-5 h-5"></i><span class="text-[10px] font-medium" x-text="t('account')"></span>
      </a>
    </div>
  </nav>

  <!-- ==================================================================
       SCRIPTS — Alpine + Swiper init + Lucide render
       ================================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    // Swiper hero carousel
    document.addEventListener('DOMContentLoaded', () => {
      window.lucide && lucide.createIcons();
      new Swiper('.hero-swiper', {
        loop: true,
        autoplay: { delay: 4500, disableOnInteraction: false },
        pagination: { el: '.hero-swiper .swiper-pagination', clickable: true },
        navigation: { nextEl: '.hero-swiper .swiper-button-next', prevEl: '.hero-swiper .swiper-button-prev' },
        effect: 'slide',
      });
    });
  </script>
  <!-- Alpine.js (v3 CDN) — loaded last so all x-data is registered -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
