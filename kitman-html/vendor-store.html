<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Addis Tech — Official Store | Kitman</title>
  <meta name="description" content="Kitman — the modern multi-vendor marketplace of Ethiopia. Shop authentic Ethiopian goods, tech, fashion and more. Pay with Telebirr, CBE Birr, ArifPay or Cash on Delivery." />

  <!-- Tailwind CSS (v3 CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans (EN), Noto Sans Ethiopic (AM), Cairo (AR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Swiper.js (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    // ---- Tailwind theme configuration -------------------------------------
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            forest: { light: '#0e9c60', DEFAULT: '#0b7a4b', dark: '#075c38', deep: '#043b24' },
            gold:   { light: '#ffce4d', DEFAULT: '#f5b301', dark: '#c98f00' },
            crimson:{ light: '#f04455', DEFAULT: '#d81e2c', dark: '#a8121e' },
            cream:  '#fbf6ec',
            sand:   '#f4ecdd',
            ink:    '#0f172a',
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            ethiopic: ['Noto Sans Ethiopic', 'sans-serif'],
            arabic: ['Cairo', 'sans-serif'],
          },
          boxShadow: {
            soft: '0 4px 24px -6px rgba(15,23,42,0.12)',
            card: '0 10px 30px -12px rgba(15,23,42,0.18)',
            glow: '0 8px 30px -8px rgba(11,122,75,0.45)',
          },
          borderRadius: { '2xl': '1.1rem', '3xl': '1.6rem' },
        }
      }
    }
  </script>

  <style>
    /* Warm base + smooth theme transition */
    html { scroll-behavior: smooth; }
    body { transition: background-color .3s ease, color .3s ease; }
    [x-cloak] { display: none !important; }

    /* Language-driven fonts */
    body.lang-en { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body.lang-am { font-family: 'Noto Sans Ethiopic', sans-serif; }
    body.lang-ar { font-family: 'Cairo', sans-serif; }

    /* Subtle Ethiopian-inspired geometric motif for hero backdrops */
    .motif {
      background-image:
        radial-gradient(circle at 20% 30%, rgba(245,179,1,.18) 0, transparent 22%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,.14) 0, transparent 20%),
        repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 10px, transparent 10px 20px);
    }
    /* Thin scrollbar for story rails */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Swiper theme */
    .swiper-pagination-bullet { background: #ffffff; opacity: .5; }
    .swiper-pagination-bullet-active { background: #f5b301; opacity: 1; width: 22px; border-radius: 4px; }
    .hero-swiper .swiper-button-next, .hero-swiper .swiper-button-prev { color: #fff; }
    .hero-swiper .swiper-button-next:after, .hero-swiper .swiper-button-prev:after { font-size: 20px; }

    /* Gradient text accent */
    .text-gradient { background: linear-gradient(90deg,#0b7a4b,#0e9c60); -webkit-background-clip: text; background-clip: text; color: transparent; }
  </style>

  <script>
    // ---- Global image fallback: no broken-image icons, ever ---------------
    (function () {
      var FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="#0b7a4b"/><stop offset="1" stop-color="#f5b301"/>' +
        '</linearGradient></defs><rect width="400" height="400" fill="url(#g)"/>' +
        '<text x="50%" y="56%" font-size="190" fill="rgba(255,255,255,.35)" ' +
        'text-anchor="middle" font-family="sans-serif">ኪ</text></svg>'
      );
      document.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'IMG' && t.src.indexOf('data:image') !== 0) { t.src = FALLBACK; }
      }, true);
    })();
  </script>

  <script>
    // =====================================================================
    //  Kitman — shared Alpine state, trilingual i18n engine + dark mode
    //  This same kitman() root will power every page in the marketplace.
    // =====================================================================
    function kitman() {
      return {
        // --- global state --------------------------------------------------
        lang: 'en',              // 'en' | 'am' | 'ar'
        dark: false,
        city: 'Addis Ababa',
        cartCount: 3,
        wishCount: 2,
        // UI toggles
        langModal: false,
        searchFocused: false,
        catOpen: false,
        mobileMenu: false,

        // --- notifications (demo) ------------------------------------------
        notifOpen: false,
        notifs: [
          { icon:'truck',        unread:true,  en:'Your order KTM-90312 is on its way', am:'ትዕዛዝዎ KTM-90312 በመንገድ ላይ ነው', ar:'طلبك KTM-90312 في الطريق', time:'2m' },
          { icon:'tag',          unread:true,  en:'Flash sale — up to 40% off tech',     am:'ፍላሽ ሽያጭ — እስከ 40% ቅናሽ',        ar:'تخفيضات — حتى 40٪ على التقنية',  time:'1h' },
          { icon:'star',         unread:false, en:'You received a new 5-star review',     am:'አዲስ 5 ኮከብ ግምገማ ደርሶዎታል',        ar:'حصلت على تقييم 5 نجوم',          time:'3h' },
          { icon:'wallet',       unread:false, en:'Payout of ETB 84,200 was processed',   am:'ክፍያ ETB 84,200 ተከናውኗል',          ar:'تمت تسوية ETB 84,200',           time:'1d' }
        ],
        get unread() { return this.notifs.filter(n => n.unread).length; },
        markAllRead() { this.notifs.forEach(n => n.unread = false); },

        // --- chat with seller (demo) ---------------------------------------
        chatOpen: false, chatWith: '', chatInput: '', chatMsgs: [],
        openChat(name) {
          this.chatWith = name || 'Seller';
          this.chatMsgs = [{ me:false, text:'Selam! Welcome to ' + this.chatWith + '. How can I help you today?' }];
          this.chatOpen = true;
          this.$nextTick(() => { window.lucide && lucide.createIcons(); this.chatScrollBottom(); });
        },
        sendChat(text) {
          const t = (text || this.chatInput).trim();
          if (!t) return;
          this.chatMsgs.push({ me:true, text:t });
          this.chatInput = '';
          this.$nextTick(() => this.chatScrollBottom());
          setTimeout(() => {
            this.chatMsgs.push({ me:false, text:"Thanks for reaching out! Yes, it's available. We deliver across Addis Ababa in 1-2 days and accept Telebirr, CBE Birr, ArifPay and Cash on Delivery." });
            this.$nextTick(() => { window.lucide && lucide.createIcons(); this.chatScrollBottom(); });
          }, 900);
        },
        chatScrollBottom() { const el = this.$refs.chatScroll; if (el) el.scrollTop = el.scrollHeight; },

        // --- write a review (demo) -----------------------------------------
        reviewOpen: false, reviewFor: '', reviewStars: 5, reviewText: '', reviewSent: false,
        openReview(name) { this.reviewFor = name || 'this product'; this.reviewStars = 5; this.reviewText = ''; this.reviewSent = false; this.reviewOpen = true; this.$nextTick(() => window.lucide && lucide.createIcons()); },
        submitReview() { if (!this.reviewText.trim()) return; this.reviewSent = true; this.$nextTick(() => window.lucide && lucide.createIcons()); setTimeout(() => { this.reviewOpen = false; }, 1700); },

        // --- Quick View + Compare (shared across every product card) -------
        quickView: null,          // product object shown in modal
        qvQty: 1,
        compare: [],              // products staged for comparison (max 4)
        compareOpen: false,       // comparison table modal
        openQuickView(p) { this.quickView = p; this.qvQty = 1; this.$nextTick(() => window.lucide && lucide.createIcons()); },
        toggleCompare(p) {
          const i = this.compare.findIndex(x => x.name === p.name);
          if (i > -1) { this.compare.splice(i, 1); }
          else if (this.compare.length < 4) { this.compare.push(p); }
          this.$nextTick(() => window.lucide && lucide.createIcons());
        },
        inCompare(p) { return this.compare.some(x => x.name === p.name); },
        clearCompare() { this.compare = []; this.compareOpen = false; },
        disc(p) { return p.was ? Math.round((1 - p.price / p.was) * 100) : 0; },
        qvAddToCart() { this.cartCount += this.qvQty; this.quickView = null; },

        cities: ['Addis Ababa', 'Adama', 'Hawassa', 'Bahir Dar', 'Dire Dawa', 'Mekelle', 'Gondar'],

        // --- lifecycle -----------------------------------------------------
        init() {
          this.applyLang();
          this.$watch('lang', () => this.applyLang());
          this.$watch('dark', () => document.documentElement.classList.toggle('dark', this.dark));
          this.$nextTick(() => window.lucide && lucide.createIcons());
        },
        applyLang() {
          const rtl = this.lang === 'ar';
          const el = document.documentElement;
          el.lang = this.lang; el.dir = rtl ? 'rtl' : 'ltr';
          document.body.classList.remove('lang-en','lang-am','lang-ar');
          document.body.classList.add('lang-' + this.lang);
          this.$nextTick(() => window.lucide && lucide.createIcons());
        },
        setLang(l) { this.lang = l; this.langModal = false; },

        // --- translation helper -------------------------------------------
        t(key) { return (this.dict[key] && this.dict[key][this.lang]) || (this.dict[key] && this.dict[key].en) || key; },

        langName(l) { return { en: 'English', am: 'አማርኛ', ar: 'العربية' }[l]; },

        // --- price formatter (Ethiopian Birr) -----------------------------
        etb(v) {
          const n = Number(v).toLocaleString('en-US');
          return this.lang === 'am' ? (n + ' ብር') : ('ETB ' + n);
        },

        // --- dictionary ----------------------------------------------------
        dict: {
          ship_to:      { en: 'Deliver to', am: 'መድረሻ', ar: 'التوصيل إلى' },
          support:      { en: 'Help & Support: 8556', am: 'እገዛ: 8556', ar: 'الدعم: 8556' },
          seller_link:  { en: 'Sell on Kitman', am: 'በኪትማን ይሽጡ', ar: 'بِع على كِتمان' },
          track_order:  { en: 'Track Order', am: 'ትዕዛዝ ይከታተሉ', ar: 'تتبع الطلب' },
          search_ph:    { en: 'Search products, brands & vendors…', am: 'እቃዎችን፣ ብራንዶችን ይፈልጉ…', ar: 'ابحث عن المنتجات والبائعين…' },
          all_cats:     { en: 'All Categories', am: 'ሁሉም ምድቦች', ar: 'كل الفئات' },
          account:      { en: 'Account', am: 'መለያ', ar: 'الحساب' },
          wishlist:     { en: 'Wishlist', am: 'ተመራጮች', ar: 'المفضلة' },
          cart:         { en: 'Cart', am: 'ጋሪ', ar: 'السلة' },
          home:         { en: 'Home', am: 'መነሻ', ar: 'الرئيسية' },
          categories:   { en: 'Categories', am: 'ምድቦች', ar: 'الفئات' },
          choose_lang:  { en: 'Choose your language', am: 'ቋንቋ ይምረጡ', ar: 'اختر لغتك' },
          lang_note:    { en: 'Prices, layout and reading direction adapt automatically.', am: 'ዋጋና አቀማመጥ በራስ-ሰር ይስተካከላል።', ar: 'تتكيّف الأسعار والاتجاه تلقائياً.' },
          hero1_tag:    { en: 'MADE IN ETHIOPIA', am: 'በኢትዮጵያ የተሰራ', ar: 'صُنع في إثيوبيا' },
          hero1_title:  { en: 'Authentic Habesha, delivered to your door', am: 'እውነተኛ የሀበሻ ምርቶች እስከ በርዎ', ar: 'منتجات حبشية أصيلة حتى بابك' },
          hero1_sub:    { en: 'Hand-woven Kemis, coffee & crafts from trusted local vendors.', am: 'በእጅ የተሰራ ቀሚስ፣ ቡና እና ጥበባት ከታማኝ ሻጮች።', ar: 'أزياء وبن وحِرف يدوية من بائعين موثوقين.' },
          hero2_tag:    { en: 'MEGA TECH WEEK', am: 'የቴክ ሳምንት', ar: 'أسبوع التقنية' },
          hero2_title:  { en: 'Up to 40% off phones & electronics', am: 'እስከ 40% ቅናሽ በስልኮች እና ኤሌክትሮኒክስ', ar: 'خصم حتى 40٪ على الهواتف والإلكترونيات' },
          hero2_sub:    { en: 'Genuine warranty. Free delivery across Addis Ababa.', am: 'ዋስትና ያለው። በአዲስ አበባ ነፃ መላኪያ።', ar: 'ضمان أصلي وتوصيل مجاني في أديس أبابا.' },
          hero3_tag:    { en: 'NEW SEASON', am: 'አዲስ ወቅት', ar: 'موسم جديد' },
          hero3_title:  { en: 'Fashion that moves with the city', am: 'ከከተማዋ ጋር የሚራመድ ፋሽን', ar: 'أزياء تواكب المدينة' },
          hero3_sub:    { en: 'Discover trending styles from Addis top boutiques.', am: 'ከአዲስ አበባ ምርጥ ሱቆች አዳዲስ ስታይሎች።', ar: 'اكتشف أحدث الصيحات من أرقى متاجر أديس.' },
          shop_now:     { en: 'Shop now', am: 'አሁን ይግዙ', ar: 'تسوّق الآن' },
          explore:      { en: 'Explore deals', am: 'ቅናሾችን ይመልከቱ', ar: 'استكشف العروض' },
          trust_secure: { en: '100% Secure Payments', am: '100% ደህንነቱ የተጠበቀ ክፍያ', ar: 'مدفوعات آمنة 100٪' },
          trust_cod:    { en: 'Cash on Delivery', am: 'በመቀበል ጊዜ ክፍያ', ar: 'الدفع عند الاستلام' },
          trust_pay:    { en: 'Trusted local payments', am: 'የታመኑ የአገር ውስጥ ክፍያዎች', ar: 'وسائل دفع محلية موثوقة' },
        },
      }
    }
  </script>

  <script>
    // ---- Vendor storefront: Addis Tech ------------------------------------
    function vendorStore() {
      return {
        follow: false,
        infoDrawer: false,
        tab: 'all',
        added: null,
        tabs: [
          { id: 'all',         en: 'All Products', am: 'ሁሉም', ar: 'الكل' },
          { id: 'phones',      en: 'Phones',       am: 'ስልኮች', ar: 'هواتف' },
          { id: 'audio',       en: 'Audio',        am: 'ኦዲዮ', ar: 'صوتيات' },
          { id: 'chargers',    en: 'Power',        am: 'ኃይል', ar: 'الطاقة' },
          { id: 'wearables',   en: 'Wearables',    am: 'ተለባሽ', ar: 'أجهزة يمكن ارتداؤها' },
          { id: 'accessories', en: 'Accessories',  am: 'መለዋወጫ', ar: 'ملحقات' }
        ],
        products: [
          { name: 'Samsung Galaxy A55 5G', category: 'phones', img: 'https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=500&q=70', price: 38900, was: 42000, rating: 4.7, reviews: 203, featured: true },
          { name: 'Redmi Note 13 Pro 256GB', category: 'phones', img: 'https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=500&q=70', price: 26500, was: 29000, rating: 4.6, reviews: 174, featured: true },
          { name: 'Tecno Camon 30 128GB', category: 'phones', img: 'https://images.unsplash.com/photo-1580910051074-3eb694886505?w=500&q=70', price: 19900, was: null, rating: 4.4, reviews: 96, featured: false },
          { name: 'Wireless Earbuds Pro ANC', category: 'audio', img: 'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500&q=70', price: 2240, was: 3200, rating: 4.6, reviews: 512, featured: true },
          { name: 'Bluetooth Speaker X3', category: 'audio', img: 'https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=500&q=70', price: 1850, was: null, rating: 4.5, reviews: 167, featured: false },
          { name: 'Over-Ear Headphones', category: 'audio', img: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=70', price: 3100, was: 3900, rating: 4.7, reviews: 88, featured: true },
          { name: '65W Fast Charger USB-C', category: 'chargers', img: 'https://images.unsplash.com/photo-1585790050230-5dd28404ccb9?w=500&q=70', price: 990, was: 1300, rating: 4.6, reviews: 289, featured: false },
          { name: 'Power Bank 20000mAh', category: 'chargers', img: 'https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?w=500&q=70', price: 1650, was: null, rating: 4.7, reviews: 321, featured: true },
          { name: 'Wireless Charging Pad 15W', category: 'chargers', img: 'https://images.unsplash.com/photo-1601972599720-36938d4ecd31?w=500&q=70', price: 780, was: 1000, rating: 4.4, reviews: 64, featured: false },
          { name: 'Smartwatch Fit 2', category: 'wearables', img: 'https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=500&q=70', price: 3400, was: 4200, rating: 4.5, reviews: 132, featured: true },
          { name: 'Fitness Band Lite', category: 'wearables', img: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=70', price: 1450, was: null, rating: 4.3, reviews: 77, featured: false },
          { name: 'Silicone Phone Case', category: 'accessories', img: 'https://images.unsplash.com/photo-1520923642038-b4259acecbd7?w=500&q=70', price: 450, was: 650, rating: 4.5, reviews: 76, featured: false },
          { name: 'Tempered Glass Protector', category: 'accessories', img: 'https://images.unsplash.com/photo-1616348436168-de43ad0db179?w=500&q=70', price: 250, was: null, rating: 4.4, reviews: 90, featured: false }
        ],
        quickAdd(n) { cartCount++; this.added = n; setTimeout(() => { if (this.added === n) this.added = null }, 1400); },
        get filtered() { return this.tab === 'all' ? this.products : this.products.filter(p => p.category === this.tab); },
        get featuredList() { return this.products.filter(p => p.featured); },
        get deals() { return this.products.filter(p => p.was); },
        init() {
          this.$watch('tab', () => this.$nextTick(() => window.lucide && lucide.createIcons()));
          this.$nextTick(() => window.lucide && lucide.createIcons());
        }
      }
    }
  </script>
</head>

<body class="lang-en bg-cream text-ink dark:bg-ink dark:text-slate-100 antialiased pb-16 md:pb-0"
      x-data="kitman()" x-init="init()" x-cloak>

  <!-- ==================================================================
       1 · TOP MICRO BAR — language · deliver-to city · support · seller
       ================================================================== -->
  <div class="hidden md:block bg-forest-deep text-cream/90 text-xs">
    <div class="max-w-7xl mx-auto px-4 h-9 flex items-center justify-between">
      <div class="flex items-center gap-5">
        <!-- Language switcher trigger -->
        <button @click="langModal = true" class="flex items-center gap-1.5 hover:text-gold transition">
          <i data-lucide="globe" class="w-3.5 h-3.5"></i>
          <span x-text="langName(lang)"></span>
          <i data-lucide="chevron-down" class="w-3 h-3"></i>
        </button>
        <!-- Deliver-to city -->
        <div class="flex items-center gap-1.5">
          <i data-lucide="map-pin" class="w-3.5 h-3.5 text-gold"></i>
          <span x-text="t('ship_to')"></span>
          <select x-model="city" class="bg-transparent border-none text-cream/90 focus:ring-0 cursor-pointer hover:text-gold py-0 pe-5">
            <template x-for="c in cities" :key="c"><option class="text-ink" x-text="c" :value="c"></option></template>
          </select>
        </div>
      </div>
      <div class="flex items-center gap-5">
        <a href="#" class="flex items-center gap-1.5 hover:text-gold transition"><i data-lucide="package-search" class="w-3.5 h-3.5"></i><span x-text="t('track_order')"></span></a>
        <a href="#" class="flex items-center gap-1.5 hover:text-gold transition"><i data-lucide="headphones" class="w-3.5 h-3.5"></i><span x-text="t('support')"></span></a>
        <a href="vendor-register.html" class="flex items-center gap-1.5 font-semibold text-gold hover:text-gold-light transition"><i data-lucide="store" class="w-3.5 h-3.5"></i><span x-text="t('seller_link')"></span></a>
      </div>
    </div>
  </div>

  <!-- ==================================================================
       2 · MAIN HEADER — logo · smart search · account/wishlist/cart
       ================================================================== -->
  <header class="sticky top-0 z-40 bg-cream/95 dark:bg-ink/95 backdrop-blur border-b border-black/5 dark:border-white/10 shadow-soft">

          </template>
          <!-- price -->
          <div class="py-3 border-t border-black/5 dark:border-white/10 font-medium text-ink/60 dark:text-slate-400" x-text="lang==='am'?'ዋጋ':lang==='ar'?'السعر':'Price'"></div>
          <template x-for="c in compare" :key="'p'+c.name"><div class="py-3 border-t border-black/5 dark:border-white/10"><span class="font-extrabold text-forest dark:text-forest-light" x-text="etb(c.price)"></span><span x-show="c.was" class="block text-[11px] text-ink/40 line-through" x-text="c.was?etb(c.was):''"></span></div></template>
          <!-- discount -->
          <div class="py-3 border-t border-black/5 dark:border-white/10 font-medium text-ink/60 dark:text-slate-400" x-text="lang==='am'?'ቅናሽ':lang==='ar'?'الخصم':'Discount'"></div>
          <template x-for="c in compare" :key="'d'+c.name"><div class="py-3 border-t border-black/5 dark:border-white/10"><span x-show="c.was" class="px-1.5 py-0.5 rounded bg-crimson/10 text-crimson font-bold text-xs" x-text="'-'+disc(c)+'%'"></span><span x-show="!c.was" class="text-ink/40">—</span></div></template>
          <!-- rating -->
          <div class="py-3 border-t border-black/5 dark:border-white/10 font-medium text-ink/60 dark:text-slate-400" x-text="lang==='am'?'ደረጃ':lang==='ar'?'التقييم':'Rating'"></div>
          <template x-for="c in compare" :key="'r'+c.name"><div class="py-3 border-t border-black/5 dark:border-white/10 flex items-center gap-1"><i data-lucide="star" class="w-4 h-4 fill-gold text-gold"></i><b x-text="c.rating"></b><span class="text-ink/40 text-xs" x-text="'('+c.reviews+')'"></span></div></template>
          <!-- vendor -->
          <div class="py-3 border-t border-black/5 dark:border-white/10 font-medium text-ink/60 dark:text-slate-400" x-text="lang==='am'?'ሻጭ':lang==='ar'?'البائع':'Seller'"></div>
          <template x-for="c in compare" :key="'v'+c.name"><div class="py-3 border-t border-black/5 dark:border-white/10 flex items-center gap-1 text-forest font-semibold"><span x-text="c.vendor"></span><i data-lucide="badge-check" class="w-4 h-4"></i></div></template>
          <!-- action -->
          <div class="py-3 border-t border-black/5 dark:border-white/10"></div>
          <template x-for="c in compare" :key="'a'+c.name"><div class="py-3 border-t border-black/5 dark:border-white/10"><button @click="cartCount++" class="w-full h-10 rounded-xl bg-forest/10 text-forest hover:bg-forest hover:text-white font-semibold text-sm transition inline-flex items-center justify-center gap-1"><i data-lucide="plus" class="w-4 h-4"></i><span x-text="lang==='am'?'ጨምር':lang==='ar'?'أضف':'Add'"></span></button></div></template>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================================================================
       LANGUAGE SWITCHER MODAL
       ================================================================== -->
      <!-- KITMAN:CHAT -->
  <div x-show="chatOpen" x-transition.opacity class="fixed inset-0 z-[78] bg-ink/40 backdrop-blur-sm" @click.self="chatOpen=false" x-cloak>
    <div x-show="chatOpen" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-full rtl:-translate-x-full" x-transition:enter-end="translate-x-0"
         class="absolute inset-y-0 end-0 w-full max-w-md bg-cream dark:bg-ink shadow-2xl flex flex-col">
      <div class="flex items-center gap-3 p-4 border-b border-black/5 dark:border-white/10 bg-white/70 dark:bg-slate-900/70 backdrop-blur">
        <span class="grid place-items-center w-10 h-10 rounded-full bg-forest text-white font-extrabold" x-text="chatWith.slice(0,2).toUpperCase()"></span>
        <div class="flex-1 min-w-0"><div class="flex items-center gap-1 font-bold"><span x-text="chatWith"></span><i data-lucide="badge-check" class="w-4 h-4 text-forest"></i></div><div class="text-[11px] text-forest inline-flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span><span x-text="lang==='am'?'ብዙ ጊዜ በ2 ሰዓት ይመልሳል':lang==='ar'?'يرد عادة خلال ساعتين':'Typically replies in ~2h'"></span></div></div>
        <button @click="chatOpen=false" class="grid place-items-center w-9 h-9 rounded-xl hover:bg-black/5 dark:hover:bg-white/10"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div x-ref="chatScroll" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="text-center"><span class="text-[11px] text-ink/40 dark:text-slate-500 bg-black/[0.04] dark:bg-white/5 px-3 py-1 rounded-full" x-text="lang==='am'?'ዛሬ':lang==='ar'?'اليوم':'Today'"></span></div>
        <template x-for="(m,i) in chatMsgs" :key="i">
          <div :class="m.me?'justify-end':'justify-start'" class="flex">
            <div :class="m.me?'bg-forest text-white rounded-br-md':'bg-white dark:bg-slate-800 ring-1 ring-black/5 dark:ring-white/10 rounded-bl-md'" class="max-w-[80%] px-3.5 py-2.5 rounded-2xl text-sm leading-snug shadow-soft" x-text="m.text"></div>
          </div>
        </template>
      </div>
      <div class="px-4 pb-2 flex flex-wrap gap-2">
        <template x-for="q in [{en:'Is this in stock?',am:'በክምችት አለ?',ar:'هل هو متوفر؟'},{en:'Delivery time?',am:'የማድረሻ ጊዜ?',ar:'مدة التوصيل؟'},{en:'Best price?',am:'የመጨረሻ ዋጋ?',ar:'أفضل سعر؟'}]" :key="q.en">
          <button @click="sendChat(lang==='am'?q.am:lang==='ar'?q.ar:q.en)" class="px-3 py-1.5 rounded-full bg-forest/10 text-forest text-xs font-semibold hover:bg-forest hover:text-white transition" x-text="lang==='am'?q.am:lang==='ar'?q.ar:q.en"></button>
        </template>
      </div>
      <div class="p-3 border-t border-black/5 dark:border-white/10 bg-white/70 dark:bg-slate-900/70 backdrop-blur">
        <div class="flex items-center gap-2">
          <input type="text" x-model="chatInput" @keydown.enter="sendChat()" :placeholder="lang==='am'?'መልእክት ይጻፉ…':lang==='ar'?'اكتب رسالة…':'Type a message…'" class="flex-1 px-4 py-3 rounded-2xl ring-1 ring-black/10 dark:ring-white/15 bg-white dark:bg-slate-800 outline-none focus:ring-2 focus:ring-forest text-sm" />
          <button @click="sendChat()" class="grid place-items-center w-11 h-11 rounded-2xl bg-forest text-white shadow-glow hover:bg-forest-dark transition"><i data-lucide="send" class="w-5 h-5 rtl:rotate-180"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- KITMAN:NOTIF -->
  <div x-show="notifOpen" x-transition.opacity class="fixed inset-0 z-[75]" @click.self="notifOpen=false" x-cloak>
    <div x-show="notifOpen" x-transition
         class="absolute top-[4.75rem] end-3 md:end-6 w-80 max-w-[92vw] bg-white dark:bg-slate-800 rounded-2xl shadow-[0_24px_60px_-15px_rgba(15,23,42,0.35)] ring-1 ring-black/5 dark:ring-white/10 overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-black/5 dark:border-white/10">
        <span class="font-bold" x-text="lang==='am'?'ማሳወቂያዎች':lang==='ar'?'الإشعارات':'Notifications'"></span>
        <button @click="markAllRead()" class="text-xs font-semibold text-forest hover:underline" x-text="lang==='am'?'ሁሉንም አንብብ':lang==='ar'?'تعليم الكل كمقروء':'Mark all read'"></button>
      </div>
      <div class="max-h-80 overflow-y-auto divide-y divide-black/5 dark:divide-white/10">
        <template x-for="(n,i) in notifs" :key="i">
          <div class="flex items-start gap-3 px-4 py-3 hover:bg-black/[0.03] dark:hover:bg-white/5 transition">
            <span class="grid place-items-center w-9 h-9 rounded-xl bg-forest/10 text-forest shrink-0"><i :data-lucide="n.icon" class="w-[18px] h-[18px]"></i></span>
            <div class="flex-1 min-w-0"><p class="text-sm leading-snug" x-text="lang==='am'?n.am:lang==='ar'?n.ar:n.en"></p><p class="text-[11px] text-black/40 dark:text-white/40 mt-0.5" x-text="n.time"></p></div>
            <span x-show="n.unread" class="w-2 h-2 rounded-full bg-crimson mt-1.5 shrink-0"></span>
          </div>
        </template>
      </div>
      <a href="#" class="block text-center px-4 py-3 text-sm font-semibold text-forest hover:bg-black/[0.03] dark:hover:bg-white/5 border-t border-black/5 dark:border-white/10" x-text="lang==='am'?'ሁሉንም ማሳወቂያ ይመልከቱ':lang==='ar'?'عرض كل الإشعارات':'View all notifications'"></a>
    </div>
  </div>

  <div x-show="langModal" x-transition.opacity class="fixed inset-0 z-[60] bg-ink/60 backdrop-blur-sm grid place-items-center p-4" @click.self="langModal=false" x-cloak>
    <div x-show="langModal" x-transition.scale class="w-full max-w-sm bg-white dark:bg-slate-800 rounded-3xl shadow-card p-6">
      <div class="flex items-center justify-between mb-1">
        <h3 class="text-lg font-bold" x-text="t('choose_lang')"></h3>
        <button @click="langModal=false" class="p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <p class="text-sm text-ink/60 dark:text-slate-400 mb-4" x-text="t('lang_note')"></p>
      <div class="space-y-2">
        <template x-for="l in ['en','am','ar']" :key="l">
          <button @click="setLang(l)" :class="lang===l ? 'ring-2 ring-forest bg-forest/5' : 'ring-1 ring-black/10 dark:ring-white/10'"
                  class="w-full flex items-center justify-between px-4 py-3 rounded-2xl transition hover:bg-forest/5">
            <span class="flex items-center gap-3">
              <span class="grid place-items-center w-9 h-9 rounded-xl bg-forest/10 text-forest font-bold" x-text="l==='en'?'EN':l==='am'?'አ':'ع'"></span>
              <span class="font-semibold" x-text="langName(l)"></span>
            </span>
            <i data-lucide="check" class="w-5 h-5 text-forest" x-show="lang===l"></i>
          </button>
        </template>
      </div>
    </div>
  </div>

  <!-- ==================================================================
       MOBILE SLIDE-OVER MENU
       ================================================================== -->
  <div x-show="mobileMenu" x-transition.opacity class="fixed inset-0 z-[60] bg-ink/50 md:hidden" @click.self="mobileMenu=false" x-cloak>
    <div x-show="mobileMenu"
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="-translate-x-full rtl:translate-x-full" x-transition:enter-end="translate-x-0"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full rtl:translate-x-full"
         class="absolute inset-y-0 start-0 w-80 max-w-[85%] bg-cream dark:bg-ink shadow-card p-5 overflow-y-auto">
      <div class="flex items-center justify-between mb-6">
        <span class="text-xl font-extrabold text-forest">Kitman</span>
        <button @click="mobileMenu=false" class="p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <button @click="langModal=true; mobileMenu=false" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl bg-white dark:bg-slate-800 ring-1 ring-black/5 dark:ring-white/10 mb-4">
        <i data-lucide="globe" class="w-5 h-5 text-forest"></i><span class="font-semibold" x-text="langName(lang)"></span>
      </button>
      <nav class="space-y-1">
        <template x-for="m in [
          {k:'home', href:'index.html', icon:'home'},
          {k:'categories', href:'shop.html', icon:'layout-grid'},
          {k:'track_order', href:'orders.html', icon:'package-search'},
          {k:'wishlist', href:'wishlist.html', icon:'heart'},
          {k:'account', href:'profile.html', icon:'user-round'},
          {k:'seller_link', href:'vendor-register.html', icon:'store'}
        ]" :key="m.k">
          <a :href="m.href" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-forest/5 dark:hover:bg-white/5 font-medium">
            <i :data-lucide="m.icon" class="w-5 h-5 text-forest"></i><span x-text="t(m.k)"></span>
          </a>
        </template>
      </nav>
    </div>
  </div>

  <!-- ==================================================================
       10 · MOBILE APP-LIKE BOTTOM NAVIGATION
       ================================================================== -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-50 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-black/5 dark:border-white/10 shadow-[0_-4px_20px_-6px_rgba(0,0,0,0.15)]">
    <div class="grid grid-cols-5 h-16">
      <a href="index.html" class="flex flex-col items-center justify-center gap-0.5 text-forest">
        <i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-semibold" x-text="t('home')"></span>
      </a>
      <a href="shop.html" class="flex flex-col items-center justify-center gap-0.5 text-ink/60 dark:text-slate-400">
        <i data-lucide="layout-grid" class="w-5 h-5"></i><span class="text-[10px] font-medium" x-text="t('categories')"></span>
      </a>
      <a href="cart.html" class="relative flex flex-col items-center justify-center gap-0.5 text-ink/60 dark:text-slate-400">
        <span class="relative">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          <span x-show="cartCount>0" class="absolute -top-1.5 -end-2 min-w-4 h-4 px-1 grid place-items-center text-[9px] font-bold text-white bg-crimson rounded-full" x-text="cartCount"></span>
        </span>
        <span class="text-[10px] font-medium" x-text="t('cart')"></span>
      </a>
      <a href="wishlist.html" class="relative flex flex-col items-center justify-center gap-0.5 text-ink/60 dark:text-slate-400">
        <span class="relative">
          <i data-lucide="heart" class="w-5 h-5"></i>
          <span x-show="wishCount>0" class="absolute -top-1.5 -end-2 min-w-4 h-4 px-1 grid place-items-center text-[9px] font-bold text-white bg-crimson rounded-full" x-text="wishCount"></span>
        </span>
        <span class="text-[10px] font-medium" x-text="t('wishlist')"></span>
      </a>
      <a href="profile.html" class="flex flex-col items-center justify-center gap-0.5 text-ink/60 dark:text-slate-400">
        <i data-lucide="user-round" class="w-5 h-5"></i><span class="text-[10px] font-medium" x-text="t('account')"></span>
      </a>
    </div>
  </nav>

  <!-- ==================================================================
       SCRIPTS — Alpine + Swiper init + Lucide render
       ================================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    // Swiper hero carousel
    document.addEventListener('DOMContentLoaded', () => {
      window.lucide && lucide.createIcons();
      new Swiper('.hero-swiper', {
        loop: true,
        autoplay: { delay: 4500, disableOnInteraction: false },
        pagination: { el: '.hero-swiper .swiper-pagination', clickable: true },
        navigation: { nextEl: '.hero-swiper .swiper-button-next', prevEl: '.hero-swiper .swiper-button-prev' },
        effect: 'slide',
      });
    });
  </script>
  <!-- Alpine.js (v3 CDN) — loaded last so all x-data is registered -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
